set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g history-limit 50000
set -g base-index 0
set -g default-shell /bin/bash
set -g default-command 'bash --init-file /workspaces/gravis_ws/operator-shell.bash'
set -g status-left '[CAT323 ROS] '
set -g status-right '#H %H:%M'
set -g escape-time 10
